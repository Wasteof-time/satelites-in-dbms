services:
  mariadb:
    image: mariadb:11
    container_name: ois-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: ois
      MARIADB_DATABASE: ois_db
      MARIADB_USER: ois
      MARIADB_PASSWORD: ois
    ports:
      - "3307:3306"
    volumes:
      - ois-mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  ois-mariadb-data:
